my_helper.hello:
  path: '/hello/{name}'
  defaults:
    _controller: '\Drupal\my_helper\Controller\HelloController::content'
    _title: 'My first page'
    name: 'Guest'
  requirements:
    # No access restriction is needed for this page.
    _access: 'TRUE'

my_helper.settings:
  path: '/admin/config/services/my_helper'
  defaults:
    _form: '\Drupal\my_helper\Form\RickAndMortySettingsForm'
    _title: 'Rick and Morty API settings'
  requirements:
    _permission: 'administer site configuration'

my_helper.api_batch_form:
  path: '/admin/config/services/rick-and-morty-batch'
  defaults:
    _form: '\Drupal\my_helper\Form\ApiBatchForm'
    _title: 'ApiItems management'
  requirements:
    _permission: 'administer site configuration'

entity.my_helper_my_helper_module.settings:
  path: 'admin/structure/my-helper-my-helper-module'
  defaults:
    _form: '\Drupal\my_helper\Form\TimeLogSettingsForm'
    _title: 'My Helper Module'
  requirements:
    _permission: 'administer my_helper_my_helper_module'

my_helper.time_log_custom_form:
  path: '/log-time'
  defaults:
    _form: '\Drupal\my_helper\Form\TimeLogCustomForm'
    _title: 'Log your time'
  requirements:
    _permission: 'access content'
